name: Milestone Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check-milestone:
    name: Verify PR Milestone Assignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate PR Milestone
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/github_milestone_manager.py check-pr --pr ${{ github.event.pull_request.number }}
