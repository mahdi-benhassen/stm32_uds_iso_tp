name: Standalone UDS ISO-TP validation

on:
  push:
    branches: [main]
    paths:
      - 'library/**'
      - 'examples/**'
      - 'App/**'
      - 'Core/**'
      - 'cmake/**'
      - 'tests/standalone/**'
      - 'tests/architecture/**'
      - 'tests/conformance/**'
      - 'tests/physical/**'
      - 'tests/portability/**'
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - 'CMakeLists.txt'
      - '*.ioc'
      - '.gitmodules'
      - 'FINAL_REPORT.md'
      - '.github/workflows/standalone-uds.yml'
  pull_request:
    paths:
      - 'library/**'
      - 'examples/**'
      - 'App/**'
      - 'Core/**'
      - 'cmake/**'
      - 'tests/standalone/**'
      - 'tests/architecture/**'
      - 'tests/conformance/**'
      - 'tests/physical/**'
      - 'tests/portability/**'
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - 'CMakeLists.txt'
      - '*.ioc'
      - '.gitmodules'
      - 'FINAL_REPORT.md'
      - '.github/workflows/standalone-uds.yml'

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy cppcheck ninja-build gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Architecture check
        run: python3 tests/architecture/check_standalone_architecture.py
      - name: Conformance and physical-plan asset check
        run: python3 tests/conformance/check_validation_assets.py
      - name: STM32F767 root cross-build
        run: |
          cmake -S . -B build/stm32f767 -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/stm32f767 --parallel
      - name: Strict C99 freestanding portability compile
        run: sh tests/portability/check_freestanding_arm_gcc.sh 4095 build/portability-arm-gcc
      - name: Configure
        run: cmake -S library -B build/standalone -G Ninja -DUDS_ISO_TP_BUILD_TESTS=ON -DUDS_ISO_TP_BUILD_EXAMPLES=ON -DUDS_ISO_TP_MAX_PAYLOAD=16384
      - name: Build
        run: cmake --build build/standalone --parallel
      - name: CTest
        run: ctest --test-dir build/standalone --output-on-failure
      - name: Instrumented coverage
        run: |
          sudo apt-get install -y gcovr
          cmake -S library -B build/coverage -G Ninja -DUDS_ISO_TP_BUILD_TESTS=ON -DUDS_ISO_TP_BUILD_EXAMPLES=ON -DCMAKE_C_FLAGS='--coverage -O0 -g'
          cmake --build build/coverage --parallel
          ctest --test-dir build/coverage --output-on-failure
          gcovr --root . --object-directory build/coverage --filter 'library/src/.*\.c' --gcov-ignore-errors all --merge-mode-functions merge-use-line-0 --txt
      - name: Sanitizer build and test
        run: |
          cmake -S library -B build/sanitize -G Ninja -DUDS_ISO_TP_BUILD_TESTS=ON -DUDS_ISO_TP_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g'
          cmake --build build/sanitize --parallel
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ctest --test-dir build/sanitize --output-on-failure
      - name: Format check
        run: clang-format --dry-run --Werror library/src/*.c library/include/uds_iso_tp/*.h library/tests/isotp/*.c library/tests/uds/*.c examples/stm32f767_bxcan/*.c examples/stm32f767_bxcan/*.h examples/stm32_fdcan/*.c examples/stm32_fdcan/*.h
      - name: Tidy and cppcheck
        run: |
          clang-tidy library/src/*.c -- -std=c11 -Ilibrary/include -Ilibrary/include/uds_iso_tp
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c11 --inline-suppr --suppress=missingIncludeSystem -Ilibrary/include library/src library/tests examples
      - name: HIL dry-run reports
        run: |
          python3 -m py_compile tests/standalone/run_uds_iso_tp_hil.py
          mkdir -p build/reports
          python3 tests/standalone/run_uds_iso_tp_hil.py --dry-run --board-profile docs/physical_validation/board_profile.yaml --analyzer ci-dry-run --json build/reports/classic.json --csv build/reports/classic.csv --report build/reports/classic.md
          python3 tests/standalone/run_uds_iso_tp_hil.py --dry-run --can-fd --board-profile docs/physical_validation/board_profile.yaml --analyzer ci-dry-run --json build/reports/fd.json --csv build/reports/fd.csv --report build/reports/fd.md
